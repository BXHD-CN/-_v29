# Render 蓝图（Blueprint）：在 Render 控制台选 New + → Blueprint，连上仓库即可按本文件创建服务。
# 文档：https://render.com/docs/blueprint-spec
#
# 注意（免费档限制，务必知晓）：
# - 免费实例 15 分钟无访问会休眠，下次访问冷启动约 30–60 秒；
# - 免费档没有持久磁盘：注册账号、告知单留档、翻译历史写入 SQLite 后，
#   会在每次重新部署 / 重启时重置（代码与种子数据不受影响，因为来自镜像内文件）。
#   需要持久化请升级 paid plan 并挂 disk，或改用外部数据库。

services:
  - type: web
    name: emergency-lang-desk
    runtime: docker
    plan: free
    region: singapore          # 离中国大陆最近的节点
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true     # Render 自动生成随机密钥，勿写死在仓库
      - key: COOKIE_SECURE
        value: "true"           # 平台强制 HTTPS，Cookie 需带 Secure
      - key: COOKIE_SAMESITE
        value: lax
      - key: DATABASE_URL
        value: sqlite:///./data/app.db
      - key: EMBEDDING_PROVIDER
        value: local
      - key: LLM_PROVIDER
        value: mock
      - key: MT_PROVIDER
        value: mymemory
      - key: NEWS_MT_PROVIDER
        value: mymemory
      - key: ASR_PROVIDER
        value: mock
