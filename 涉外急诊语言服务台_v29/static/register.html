<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="注册涉外急诊语言服务台账号，创建仅本人可见的术语与语料库。">
  <title>注册 · 涉外急诊语言服务台</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css?v=29">
  <link rel="stylesheet" href="css/retro-skin.css?v=29">
  <script src="js/i18n-dict.js?v=29"></script>
  <script src="js/i18n-labels.js?v=29"></script>
  <script src="js/i18n.js?v=29"></script>
</head>
<body data-page="register" data-section="home">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header id="site-header" class="site-header"></header>
  <main id="main" class="page">
    <div class="container auth-shell">
      <section class="card auth-card" aria-labelledby="register-title">
        <h1 id="register-title">注册</h1>
        <p class="auth-sub">创建账号后，可维护仅本人可见的术语库与语料库。</p>
        <form id="register-form" novalidate>
          <div class="field">
            <label for="register-email">邮箱</label>
            <input id="register-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required>
            <p class="field-error" id="err-email"></p>
          </div>
          <div class="field">
            <label for="register-username">用户名</label>
            <input id="register-username" name="username" type="text" autocomplete="username" placeholder="3–32 位字母、数字或下划线" required>
            <p class="field-error" id="err-username"></p>
          </div>
          <div class="form-grid">
            <div class="field">
              <label for="register-password">密码</label>
              <input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="至少 8 位" required>
              <p class="field-error" id="err-password"></p>
            </div>
            <div class="field">
              <label for="register-password2">确认密码</label>
              <input id="register-password2" name="password2" type="password" autocomplete="new-password" placeholder="再次输入密码" required>
              <p class="field-error" id="err-password2"></p>
            </div>
          </div>
          <div class="field">
            <label for="register-display">显示名称 <span class="optional">（可选）</span></label>
            <input id="register-display" name="display_name" type="text" autocomplete="nickname" placeholder="例如：急诊科小李" maxlength="32">
            <p class="field-error" id="err-display"></p>
          </div>
          <div class="notice notice--error" id="register-error" role="alert" hidden></div>
          <button class="btn btn--primary btn--block" id="register-submit" type="submit">注册并登录</button>
        </form>
        <p class="auth-alt">已有账号？<a href="login.html" id="login-link">直接登录</a></p>
      </section>
    </div>
  </main>
  <nav id="bottom-nav" class="bottom-nav" aria-label="底部导航"></nav>
  <footer id="site-footer" class="site-footer"></footer>
  <div id="toast-stack" class="toast-stack" role="status" aria-live="polite"></div>
  <script src="js/app.js?v=29" defer></script>
</body>
</html>
