# 站点反向代理与安全加固（放到 /etc/nginx/conf.d/default.conf）
# 说明：证书路径按实际替换；限流参数按需调整。

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=translate:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name trans.example.edu.cn;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;

    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    limit_conn conn 30;

    # 管理接口：只允许校内/办公网段
    location /api/admin/ {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params;
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params;
    }

    location /api/translate {
        limit_req zone=translate burst=10 nodelay;
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params;
    }

    location /static/ {
        proxy_pass http://app:8000;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params;
    }
}
