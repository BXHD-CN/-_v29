<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="管理仅本人可见的私有术语库与语料库，支持搜索、分页、增删改与 CSV 导出。">
  <title>我的 · 涉外急诊语言服务台</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css?v=29">
  <link rel="stylesheet" href="css/retro-skin.css?v=29">
  <script src="js/i18n-dict.js?v=29"></script>
  <script src="js/i18n-labels.js?v=29"></script>
  <script src="js/i18n.js?v=29"></script>
</head>
<body data-page="account" data-section="account">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header id="site-header" class="site-header"></header>
  <main id="main" class="page">
    <div class="container">
      <header class="page-head">
        <div>
          <h1>我的语言资产</h1>
          <p class="muted" id="account-greeting">正在读取账户信息…</p>
        </div>
        <span class="badge badge--private">仅本人可见</span>
      </header>

      <div class="overview-grid" id="account-overview" aria-live="polite">
        <div class="card overview-card">
          <div class="overview-value" id="overview-terms">—</div>
          <div class="overview-label">我的术语</div>
        </div>
        <div class="card overview-card">
          <div class="overview-value" id="overview-corpus">—</div>
          <div class="overview-label">我的语料</div>
        </div>
        <div class="card overview-card">
          <div class="overview-value" id="overview-chunks">—</div>
          <div class="overview-label">公共知识切片</div>
        </div>
      </div>

      <section class="card" aria-labelledby="cloud-entry-title" style="margin-bottom:20px">
        <div class="card-head">
          <h2 id="cloud-entry-title">云端资产</h2>
          <span class="badge">WorkBuddy Cloud</span>
        </div>
        <p class="muted" style="margin:0 0 14px;line-height:1.7">
          已接入真实云服务：云端身份、交接单记录（用户隔离）、交接单文件、云端 AI 交接要点整理。
          在「患者情况告知单」生成交接单后可直接把主诉与全文带到这里留档。
        </p>
        <a class="btn btn--primary" href="cloud.html">打开云端资产 →</a>
      </section>

      <section class="card" aria-labelledby="library-title">
        <div class="card-head">
          <h2 id="library-title">私有库</h2>
          <div class="tabs" role="tablist" aria-label="切换私有库">
            <button class="tab is-active" type="button" role="tab" id="tab-terms" aria-selected="true" aria-controls="account-panel" data-tab="terms">我的术语</button>
            <button class="tab" type="button" role="tab" id="tab-corpus" aria-selected="false" aria-controls="account-panel" data-tab="corpus">我的语料</button>
          </div>
        </div>

        <div class="toolbar">
          <div class="field">
            <label for="account-search">搜索我的条目</label>
            <input id="account-search" type="search" placeholder="搜索中文、英文或领域" autocomplete="off">
          </div>
          <div class="toolbar-actions">
            <button class="btn btn--ghost" id="export-btn" type="button">导出 CSV</button>
            <button class="btn btn--primary" id="new-btn" type="button">新建术语</button>
          </div>
        </div>

        <div id="account-panel" class="panel" role="tabpanel" aria-labelledby="tab-terms" aria-live="polite">
          <div class="loading-box">
            <span class="skeleton skeleton--title"></span>
            <span class="skeleton skeleton--text"></span>
            <span class="skeleton skeleton--text"></span>
          </div>
        </div>
        <div id="account-pager" class="pager"></div>
      </section>
    </div>
  </main>
  <nav id="bottom-nav" class="bottom-nav" aria-label="底部导航"></nav>
  <footer id="site-footer" class="site-footer"></footer>
  <div id="toast-stack" class="toast-stack" role="status" aria-live="polite"></div>
  <script src="js/app.js?v=29" defer></script>
</body>
</html>
