<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="聚合联合国新闻、ReliefWeb、USGS 的公开应急与人道救援资讯，提供中文标题、许可与原文链接。">
  <title>国际救援资讯 · 涉外急诊语言服务台</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css?v=29">
  <link rel="stylesheet" href="css/retro-skin.css?v=29">
  <script src="js/i18n-dict.js?v=29"></script>
  <script src="js/i18n-labels.js?v=29"></script>
  <script src="js/i18n.js?v=29"></script>
</head>
<body data-page="news" data-section="news">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header id="site-header" class="site-header"></header>
  <main id="main" class="page">
    <div class="container">
      <header class="page-head">
        <div>
          <h1>国际救援资讯</h1>
          <p class="muted">聚合联合国新闻、ReliefWeb 与 USGS 的公开资讯；中文标题标注中文化方式，原文链接在新窗口打开。</p>
        </div>
        <span class="badge badge--section">Orange · 资讯</span>
      </header>

      <div class="toolbar news-toolbar">
        <div class="tabs" id="news-status" role="tablist" aria-label="按中文化状态筛选">
          <button class="tab is-active" type="button" role="tab" aria-selected="true" data-status="published">已中文化</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-status="all">全部</button>
        </div>
        <div class="news-source">
          <label for="news-source" class="sr-only">按来源筛选</label>
          <select id="news-source">
            <option value="">全部来源</option>
            <option value="un">联合国新闻</option>
            <option value="un_zh">联合国新闻（中文版）</option>
            <option value="reliefweb">ReliefWeb</option>
            <option value="usgs">USGS 地震</option>
          </select>
        </div>
        <span class="list-meta" id="news-meta">正在加载资讯…</span>
      </div>

      <div id="news-list" class="news-list" aria-live="polite">
        <div class="card"><span class="skeleton skeleton--title"></span><span class="skeleton skeleton--text"></span><span class="skeleton skeleton--line-sm"></span></div>
      </div>
      <div id="news-pager" class="pager"></div>
    </div>
  </main>
  <nav id="bottom-nav" class="bottom-nav" aria-label="底部导航"></nav>
  <footer id="site-footer" class="site-footer"></footer>
  <div id="toast-stack" class="toast-stack" role="status" aria-live="polite"></div>
  <script src="js/app.js?v=29" defer></script>
</body>
</html>
